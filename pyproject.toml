[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "warhammer-rag"
version = "0.1.0"
description = "Class project: a conversational RAG over Warhammer rules and SQLite datasheets"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "google-genai>=1,<3",
    "prompt-toolkit>=3,<4",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "pymupdf>=1.26,<2",
    "rich>=14,<15",
]

[project.scripts]
warhammer-rag = "warhammer_rag.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4,<5",
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/warhammer_rag"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".cache", ".tools", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
required-version = ">=0.13.0,<0.14"
