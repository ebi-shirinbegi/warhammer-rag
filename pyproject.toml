[project]
name = "warhammer-rag"
version = "0.1.0"
description = "A LangChain RAG assistant for Warhammer 40,000 rules and unit datasheets."
readme = "PROJECT_DOCUMENTATION.md"
requires-python = ">=3.12"
authors = [
    { name = "Mohammad Ebrahim SHARIFI", email = "mohammad-ebrahim.sharifi@etu.u-paris.fr" },
    { name = "PARTNER NAME", email = "partner@example.com" },
]
dependencies = [
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-google-genai>=2.0",
    "docling>=2.70,<3.0",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_project"]
